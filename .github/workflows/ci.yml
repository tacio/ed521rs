name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - name: Docs
        run: cargo doc -p ed521 --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff@0.17.0 check scripts tests/python python
      - run: uvx ruff@0.17.0 format --check scripts tests/python python
      - name: Generated code is up to date
        run: |
          python3 -I scripts/gen_tables.py --check
          python3 -I scripts/gen_avx2_kernels.py --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ed521 --all-features
      - run: cargo test -p ed521 --no-default-features
      - name: Serial backend
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: cargo test -p ed521 --all-features
        env:
          RUSTFLAGS: -D warnings --cfg ed521_backend="serial"
          CARGO_TARGET_DIR: target/serial

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      # The dev-dependencies need a newer compiler, so the MSRV check builds the library only.
      - run: cargo build -p ed521 --all-features
      - run: cargo build -p ed521 --no-default-features

  python:
    name: python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      # Builds the extension (release) into .venv, with ECPy as the third oracle.
      - run: uv sync --group oracle
      - run: uv run --no-sync python -m unittest discover -s tests/python -v
      - name: Edge cases match ECPy and the reference
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: uv run --no-sync python -I scripts/gen_edge_cases.py --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p ed521 --dry-run
      - uses: astral-sh/setup-uv@v7
      - run: uvx maturin@1.15.0 sdist --out dist
