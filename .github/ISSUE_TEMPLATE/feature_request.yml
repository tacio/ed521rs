name: Feature request
description: Suggest an API, platform or performance improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behavior you have in mind, if any.
