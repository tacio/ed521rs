[package]
name = "ed521"
description = "Fast verification of Ed521 signatures (EdDSA over E-521, ICP-Brasil DOC-ICP-01.01)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/ed521"
readme = "README.md"
include = ["/src", "/tests", "/benches", "/proptest-regressions", "/README.md", "/LICENSE"]
keywords = ["ed521", "eddsa", "e-521", "signature", "icp-brasil"]
categories = ["cryptography", "no-std"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
# Random-linear-combination batch verification (cofactored; see `verify_batch`).
batch = ["alloc"]
# Variable-time signing with ECPy's key expansion, for this crate's tests, benches and fuzzing.
# Not a public API: hidden from the docs and may change or disappear in any release.
__hazmat-sign = []
# Internals for this crate's benches. Not a public API: may change in any release.
__bench = []

[dependencies]
shake = { version = "0.1", default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
cpufeatures = "0.3"

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
fiat-crypto = "0.3"
hex = "0.4"
num-bigint = "0.5"
proptest = "1.12"
serde_json = "1"

[lints]
workspace = true

[[bench]]
name = "ed521"
harness = false
required-features = ["__bench", "__hazmat-sign", "batch"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[test]]
name = "batch"
required-features = ["batch", "__hazmat-sign"]
