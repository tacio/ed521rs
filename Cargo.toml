[workspace]
members = ["crates/ed521", "crates/ed521-py"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.87"
license = "MIT"
authors = ["Tacio Medeiros"]
repository = "https://github.com/tacio/ed521rs"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(ed521_backend, values("serial", "avx2"))', 'cfg(fuzzing)'] }

# A subset of rust-bitcoin's pedantic set (rust-bitcoin/Cargo.toml), plus unsafe hygiene.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "allow" # Every truncating cast carries a comment (rust-bitcoin rule).
cast_possible_wrap = "allow"       # Same.
cast_sign_loss = "allow"           # Same.
cast_lossless = "warn"
many_single_char_names = "allow"   # Curve formulas use the published single-letter names.
similar_names = "allow"
unreadable_literal = "allow"       # Field and curve constants are copied from their sources.
too_many_lines = "allow"           # Unrolled field arithmetic.
inline_always = "allow"            # Measured per function in benches.
needless_range_loop = "allow"      # Limb loops index several arrays at once.
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
doc_markdown = "warn"
explicit_iter_loop = "warn"
if_not_else = "warn"
implicit_clone = "warn"
manual_assert = "warn"
manual_let_else = "warn"
match_wildcard_for_single_variants = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "allow" # Field elements are 72-byte Copy values passed by reference on purpose.
wrong_self_convention = "allow"      # Same: `to_*` conversions borrow their 72-byte inputs.
unnecessary_wraps = "warn"
unused_self = "warn"
use_self = "warn"
wildcard_imports = "warn"

[profile.release]
codegen-units = 1
lto = "fat"

[profile.bench]
codegen-units = 1
lto = "fat"
debug = true

# Tests keep debug assertions (limb-bound checks) but run optimized.
[profile.test]
opt-level = 3
